name: Verificar reportes y actualizar blacklist/DNS/firewall

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: '*/15 * * * *'   # también corre solo cada 15 minutos, por si algún issue quedó pendiente
  workflow_dispatch:
    inputs:
      solo_issue:
        description: 'Número de un issue específico a procesar (opcional, vacío = todos los pendientes)'
        required: false

# Evita que dos ejecuciones corran al mismo tiempo e intenten subir cambios
# a la vez (eso es justo lo que causó el error "rejected... fetch first").
# Las ejecuciones nuevas esperan a que termine la anterior, en vez de pisarse.
concurrency:
  group: verificar-y-publicar
  cancel-in-progress: false

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar dominios reportados y regenerar listas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          SOLO_ISSUE_NUMERO: ${{ github.event.inputs.solo_issue || (github.event.issue && github.event.issue.number) || '' }}
        run: node scripts/verificar-y-actualizar.js

      - name: Confirmar y subir cambios en las listas
        run: |
          git config user.name "antiphishingrd-bot"
          git config user.email "antiphishingrd-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: actualizar listas verificadas [skip ci]" || echo "Nada que commitear"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rechazado (otra ejecución subió cambios primero). Sincronizando y reintentando…"
            git pull --rebase --autostash
            sleep 3
          done
