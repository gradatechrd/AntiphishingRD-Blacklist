name: Verificar reportes y actualizar blacklist/DNS/firewall

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: '*/15 * * * *'   
  workflow_dispatch:
    inputs:
      solo_issue:
        description: 'Número de un issue específico a procesar (opcional, vacío = todos los pendientes)'
        required: false

concurrency:
  group: verificar-y-publicar
  cancel-in-progress: false

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
      URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
      SOLO_ISSUE_NUMERO: ${{ github.event.inputs.solo_issue || (github.event.issue && github.event.issue.number) || '' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar dominios, regenerar listas y publicar
        run: |
          git config user.name "antiphishingrd-bot"
          git config user.email "antiphishingrd-bot@users.noreply.github.com"

          PUBLICADO=0
          for i in 1 2 3 4 5; do
            echo "--- Intento $i: planificando y regenerando listas ---"
            node scripts/verificar-y-actualizar.js planificar

            git add -A
            git commit -m "chore: actualizar listas verificadas [skip ci]" || echo "Nada que commitear"

            if git push; then
              echo "Publicado correctamente."
              PUBLICADO=1
              break
            fi

            echo "Push rechazado (otra ejecución subió cambios primero)."
            echo "Descartando los archivos generados en este intento y volviendo a generarlos sobre la versión más reciente…"
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done

          if [ "$PUBLICADO" != "1" ]; then
            echo "No se logró publicar tras varios intentos. No se van a comentar/cerrar issues todavía."
            exit 1
          fi

      - name: Comentar y cerrar los issues ya publicados
        if: success()
        run: node scripts/verificar-y-actualizar.js aplicar
