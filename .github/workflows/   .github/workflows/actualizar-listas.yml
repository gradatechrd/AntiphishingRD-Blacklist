name: Verificar reportes y actualizar blacklist/DNS/firewall

# Este workflow es lo que hace que la blacklist, la zona DNS y el alias de
# firewall se actualicen SOLOS: cada vez que alguien reporta un dominio desde
# AntiPhishingRD (o cada pocas horas, por si quedó algo pendiente), este
# workflow vuelve a verificar el dominio contra VirusTotal y urlscan.io antes
# de publicarlo. Ningún dominio se agrega solo porque un usuario lo reportó.
#
# Vive en el repositorio de la BLACKLIST (no en el del sitio), junto con
# blacklist.txt. Copia también la carpeta scripts/ a ese repositorio.

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: '0 */6 * * *'   # reintenta cada 6 horas por si algo quedó pendiente
  workflow_dispatch: {}      # botón "Run workflow" para forzar una pasada manual

permissions:
  contents: write
  issues: write

jobs:
  verificar-y-publicar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'reporte-dominio')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar dominios reportados y regenerar listas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          SOLO_ISSUE_NUMERO: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: node scripts/verificar-y-actualizar.js

      - name: Confirmar y subir cambios en las listas
        run: |
          git config user.name "antiphishingrd-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add blacklist.txt dns/ firewall/ 2>/dev/null || true
            git commit -m "chore: actualizar listas verificadas [skip ci]"
            git push
          else
            echo "Sin cambios verificados en esta pasada."
          fi
